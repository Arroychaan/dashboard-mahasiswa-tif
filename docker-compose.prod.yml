services:
  postgres:
    image: postgres:16-alpine
    container_name: unissula_if_dashboard_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_mahasiswa}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_db_net
    # Security: Do NOT publish port 5432 to the host/internet in production.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-dashboard_mahasiswa}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: unissula-if-dashboard:latest
    container_name: unissula_if_dashboard_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (min 32 chars)}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dashboard_mahasiswa}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - lecturer_photos_prod:/app/public/uploads/lecturers
    networks:
      - internal_db_net
      - web_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  internal_db_net:
    driver: bridge
    internal: true
  web_net:
    driver: bridge

volumes:
  postgres_prod_data:
  lecturer_photos_prod:

